[package]
name = "perseus"
version = "0.1.0"
description = "Open-source visual Git client"
authors = ["Miguel Póvoas"]
edition = "2024"
publish = false
license = "MIT"

[lib]
# The `_lib` suffix is required on Windows to avoid a bin/lib name collision.
# See https://github.com/rust-lang/cargo/issues/8519
name = "perseus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Capitalised so that a bare executable (`pnpm tauri dev`) is called "Perseus" in the macOS Dock;
# the packaged app takes its name from `productName`.
[[bin]]
name = "Perseus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
perseus-credentials = { path = "../crates/perseus-credentials" }
perseus-askpass = { path = "../crates/perseus-askpass" }
tauri = { version = "2", features = ["isolation", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
thiserror = "2.0.21"
gix = "0.90.0"
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }
open = "5.4.5"
sha2 = "0.10"
ureq = { version = "3.5.0", features = ["platform-verifier"] }
notify = "8"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
tempfile = "3.27.0"

[[bench]]
name = "lanes"
harness = false

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
