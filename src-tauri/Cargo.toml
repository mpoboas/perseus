[package]
name = "perseus"
version = "0.1.0"
description = "Open-source visual Git client"
authors = ["Miguel Póvoas"]
edition = "2024"

[lib]
# The `_lib` suffix is required on Windows to avoid a bin/lib name collision.
# See https://github.com/rust-lang/cargo/issues/8519
name = "perseus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
thiserror = "2.0.21"
gix = "0.90.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
tempfile = "3.27.0"

[[bench]]
name = "lanes"
harness = false
