[package]
name = "perseus-credentials"
version = "0.1.0"
description = "Credential storage and the git credential-helper protocol for Perseus"
edition = "2024"
publish = false

[dependencies]
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["platform-verifier"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
