name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories are published without any change to this repo, so re-check weekly.
  schedule:
    - cron: "17 5 * * 1"

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories (RustSec), licenses, duplicate versions and allowed sources: see deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The app bundles the credential helper as an externalBin: build it first, or the app's
      # build script cannot find it.
      - run: node scripts/prepare-helper.mjs debug
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests that need a real OS keychain are #[ignore]d and run locally only.
      - run: cargo test --workspace

  # An unsigned Windows installer on every push: packaging surprises show up early, and the
  # end-to-end tests run against the same production executable.
  windows-build:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm tauri build
      - name: End-to-end tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        with:
          name: perseus-windows-installer
          path: target/release/bundle/nsis/*.exe
